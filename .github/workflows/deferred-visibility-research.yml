name: Deferred visibility research evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/graphics/deferred_visibility.py'
      - 'software_gpu/graphics/rasterizer.py'
      - 'software_gpu/tests/test_deferred_visibility.py'
      - 'software_gpu/benchmarks/compare_deferred_visibility.py'
      - '.github/workflows/deferred-visibility-research.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deferred-visibility-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: Deferred visibility exact RGBA and Depth parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Run real framebuffer/depth tests with negative shader admission
        run: python -m unittest software_gpu.tests.test_deferred_visibility -v

  paired:
    needs: parity
    name: Real CPU 15-pair AB/BA parity and timing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Serial reference/deferred real frame timings with exact frame SHA
        run: python -m software_gpu.benchmarks.compare_deferred_visibility --output "$RUNNER_TEMP/deferred/benchmark.json" --repeats 15 --workers 2 --pixels 96
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: deferred-visibility-abba-${{ github.sha }}
          path: ${{ runner.temp }}/deferred/benchmark.json
          if-no-files-found: ignore
          retention-days: 30
