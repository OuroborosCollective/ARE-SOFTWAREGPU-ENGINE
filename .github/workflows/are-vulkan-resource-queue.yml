name: ARE real pre-VkDevice C++ resource queue
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/vulkan/resource_queue.hpp'
      - 'native/vulkan/resource_queue_test.cpp'
      - 'software_gpu/drivers/verify_resource_queue.py'
      - '.github/workflows/are-vulkan-resource-queue.yml'
  push:
    branches: [main]
    paths:
      - 'native/vulkan/resource_queue.hpp'
      - 'native/vulkan/resource_queue_test.cpp'
      - 'software_gpu/drivers/verify_resource_queue.py'
      - '.github/workflows/are-vulkan-resource-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-queue:
    name: Real owned C++ resource queues / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python array dependency for repository package imports
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Install Python import dependencies for the canonical ARE compiler helper
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Install existing package dependency for verifier import\n        run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3'\n      - name: Real C++17 ARE raster parity, owned buffers, replay and rollback
        shell: bash
        env:
          EXACT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m software_gpu.drivers.verify_resource_queue \
            --expected-revision "$EXACT_REVISION" \
            --output evidence-local/predevice-resource-queue/receipt.json
      - name: Preserve original native C++ frame receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: are-predevice-resource-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-local/predevice-resource-queue/receipt.json
          if-no-files-found: ignore
          retention-days: 30
