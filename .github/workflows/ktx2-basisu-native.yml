name: KTX2 BasisU native admission and local learn-route proof

on:
  pull_request:
    paths:
      - 'tools/ktx2_texture_admission.py'
      - 'software_gpu/tests/test_ktx2_texture_admission.py'
      - 'software_gpu/tests/test_learning_route_coverage.py'
      - '.github/workflows/ktx2-basisu-native.yml'
      - 'software_gpu/graphics/**'
      - 'software_gpu/learning.py'
      - 'software_gpu/integrations/render_video.py'
      - 'docs/KTX2_BASISU_ADMISSION_20261121.md'
  push:
    branches: [main]
    paths:
      - 'tools/ktx2_texture_admission.py'
      - 'software_gpu/tests/test_ktx2_texture_admission.py'
      - 'software_gpu/tests/test_learning_route_coverage.py'
      - '.github/workflows/ktx2-basisu-native.yml'
      - 'software_gpu/graphics/**'
      - 'software_gpu/learning.py'
      - 'software_gpu/integrations/render_video.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ktx-native-and-learn-coverage:
    name: Khronos 4.4.2 real BasisU plus raster and export learn routes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin and unpack Khronos KTX Software 4.4.2 (not a vendored binary)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/are-ktx"
          curl --fail --location --show-error --silent --retry 2 \
            https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.tar.bz2 \
            -o "$RUNNER_TEMP/are-ktx/KTX-Software-4.4.2-Linux-x86_64.tar.bz2"
          printf '%s  %s\n' \
            a8781bad05f9624edbf910b7f258cd0a4ba7d3e63b49ecc0a0ab440bf6a0a245 \
            "$RUNNER_TEMP/are-ktx/KTX-Software-4.4.2-Linux-x86_64.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/are-ktx/KTX-Software-4.4.2-Linux-x86_64.tar.bz2" -C "$RUNNER_TEMP/are-ktx"
          bin="$RUNNER_TEMP/are-ktx/KTX-Software-4.4.2-Linux-x86_64/bin/ktx"
          printf '%s  %s\n' \
            2028e023a18e827e66362a9e184052f40192566b10f92655a337e2eb8ea0829b "$bin" | sha256sum --check
          "$bin" --version
          echo "ARE_KHRONOS_KTX_BINARY=$bin" >> "$GITHUB_ENV"
      - name: Install actual software dependencies
        run: python -m pip install '.[model-pbr,jit]'
      - name: Real BasisU native PBR and negative admission tests
        run: python -m unittest software_gpu.tests.test_ktx2_texture_admission -v
      - name: Install real FFmpeg and ffprobe for required video learning proof
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: All registered raster backends plus FFmpeg/export learning routes
        run: python -m unittest software_gpu.tests.test_learning_route_coverage -v
      - name: Existing native PBR and material regression
        run: python -m unittest software_gpu.tests.test_model_material software_gpu.tests.test_visual_asset_lab_native -v
