name: Offline adaptive cost calibration / deterministic replay
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/compare_surface_plans.py'
      - 'software_gpu/benchmarks/calibrate_surface_costs.py'
      - 'software_gpu/tests/test_surface_cost_calibration.py'
      - '.github/workflows/issue286-surface-cost.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measured-holdout:
    name: Real CPU / 15 interleaved pairs / holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install real CPU-only renderer dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3' 'Pillow>=9.0'
      - name: RED/GREEN validation, model digest and negative contracts
        run: python -m unittest software_gpu.tests.test_surface_cost_calibration software_gpu.tests.test_adaptive_surface_plan -v
      - name: Measure real training geometries, four same-shader factorials
        run: >-
          python -u -m software_gpu.benchmarks.compare_surface_plans
          --output-dir evidence/issue286-ci/training --scene-set training
          --repeats 15 --pixels 64 --workers 1 --ablation --max-seconds 900
      - name: Measure withheld independent geometries, same CPU/source
        run: >-
          python -u -m software_gpu.benchmarks.compare_surface_plans
          --output-dir evidence/issue286-ci/holdout --scene-set holdout
          --repeats 15 --pixels 64 --workers 1 --ablation --max-seconds 900
      - name: Calibrate source-bound frozen weights and refuse unproven routes
        run: >-
          python -m software_gpu.benchmarks.calibrate_surface_costs
          --training evidence/issue286-ci/training/surface-plan-benchmark.json
          --holdout evidence/issue286-ci/holdout/surface-plan-benchmark.json
          --root . --source-revision "${{ github.sha }}"
          --output evidence/issue286-ci/frozen-cost-model.json
      - name: Independently audit both measured benchmark receipts
        run: |
          python plugins/softwaregpu-workbench/skills/softwaregpu-workbench/scripts/workbench.py audit evidence/issue286-ci/training/surface-plan-benchmark.json --root . --output evidence/issue286-ci/training/audit.json
          python plugins/softwaregpu-workbench/skills/softwaregpu-workbench/scripts/workbench.py audit evidence/issue286-ci/holdout/surface-plan-benchmark.json --root . --output evidence/issue286-ci/holdout/audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: issue286-real-cpu-15-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/issue286-ci/
          if-no-files-found: ignore
          retention-days: 30
