name: Verified GoReleaser release

on:
  # A GITHUB_TOKEN-created tag does not itself fire a new workflow.
  # Explicit dispatch on that exact tag is the supported one-shot bootstrap path.
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: 'One-time immutable v1.2.0 recovery target'
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/goreleaser.yml'
      - '.github/workflows/bootstrap-pypi-v120.yml'
      - 'tools/release_gate.py'
      - 'software_gpu/tests/test_release_gate.py'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'docs/PYPI_PACKAGE.md'
      - 'tools/pypi_index_readback.py'
      - 'software_gpu/tests/test_public_package_release.py'
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: verified-goreleaser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate configuration, wheel and snapshot without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_DISCORD_ANNOUNCE: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exercise release gate negative and positive cases
        run: |
          python -m unittest discover -s software_gpu/tests -p test_release_gate.py -v
          python -m unittest discover -s software_gpu/tests -p test_public_package_release.py -v
      - name: Build real redistributable Python wheel
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps --wheel-dir release-assets .
          test "$(find release-assets -maxdepth 1 -name 'ouroboroscollective_softwaregpu-*.whl' | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path, = list(Path('release-assets').glob('ouroboroscollective_softwaregpu-*.whl'))
          with ZipFile(path) as archive:
              assert any(p.endswith('/LICENSE.md') for p in archive.namelist())
              assert any(p.endswith('/NOTICE') for p in archive.namelist())
          print('WHEEL_LICENSE_NOTICE_OK')
          PY
      - name: Build and verify actual public PyPI wheel and source package
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build
          python -m build --sdist --wheel --outdir pypi-dist
          test "$(find pypi-dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find pypi-dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          from tools.release_gate import verify_wheel, verify_sdist
          wheel, = Path("pypi-dist").glob("*.whl")
          sdist, = Path("pypi-dist").glob("*.tar.gz")
          from tools.release_gate import wheel_version
          name = wheel.name.removeprefix("ouroboroscollective_softwaregpu-")
          version = name.split("-", 1)[0]
          import re
          match = re.fullmatch(r"(\d+\.\d+\.\d+)(?:(a|b|rc)(\d+))?", version)
          if match is None:
              raise SystemExit("WHEEL_VERSION_INVALID")
          suffix = "" if match[2] is None else "-{}.{}".format(
              {"a": "alpha", "b": "beta", "rc": "rc"}[match[2]], match[3])
          tag = "v" + match[1] + suffix
          verify_wheel(wheel, tag)
          verify_sdist(sdist, tag)
          print("PYPI_DIST_CONTRACT_OK")
          PY
      - name: Install and validate GoReleaser OSS
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: GoReleaser check and local snapshot (never publishes)
        run: |
          set -euo pipefail
          goreleaser check
          goreleaser release --snapshot --clean
          test -s dist/checksums.txt
          grep -F 'ouroboroscollective_softwaregpu-' dist/checksums.txt
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -ge 1

  publish:
    name: Publish only exact-main fully green CPU CI tag
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_DISCORD_ANNOUNCE: ${{ secrets.DISCORD_WEBHOOK_ID != '' && secrets.DISCORD_WEBHOOK_TOKEN != '' && 'true' || 'false' }}
      DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
      DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build tagged wheel from exactly the source being published
        run: python -m pip wheel --no-deps --wheel-dir release-assets .
      - name: Require exact SHA and all eight main CPU regressions jobs green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cpu-regressions.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100 > "$RUNNER_TEMP/cpu-runs.json"
          run_id="$(python tools/release_gate.py --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --runs "$RUNNER_TEMP/cpu-runs.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/cpu-jobs.json"
          python tools/release_gate.py --tag "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --runs "$RUNNER_TEMP/cpu-runs.json" --jobs "$RUNNER_TEMP/cpu-jobs.json" \
            --wheel release-assets/ouroboroscollective_softwaregpu-*.whl
      - name: Require exact-main Windows/Linux installed-package matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/public-package-install.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100 > "$RUNNER_TEMP/package-runs.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from tools.release_gate import select_run, verify_jobs
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          runs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "package-runs.json").read_text())
          run_id = select_run(runs, sha, repo)
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"],
              text=True)
          jobs = json.loads(raw)
          verify_jobs(jobs, run_id, minimum=4)
          names = [item.get("name", "") for item in jobs["jobs"]]
          for platform in ("ubuntu-latest", "windows-latest"):
              for py in ("3.11", "3.12"):
                  if not any(platform in n and "Python " + py in n for n in names):
                      raise SystemExit("PACKAGE_MATRIX_MISSING_" + platform + "_" + py)
          print("EXACT_MAIN_PACKAGE_MATRIX_OK", run_id)
          PY
      - name: Install GoReleaser OSS
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: Publish semver release and optional Discord announcement
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - name: Read back exact tag, SHA and released assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' | grep -qx false
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName --jq '.tagName' | grep -Fxq "$GITHUB_REF_NAME"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > "$RUNNER_TEMP/released-assets.txt"
          grep -E '^ouroboroscollective_softwaregpu-.*[.]whl$' "$RUNNER_TEMP/released-assets.txt"
          grep -Fx 'checksums.txt' "$RUNNER_TEMP/released-assets.txt"
          grep -E '[.]tar[.]gz$' "$RUNNER_TEMP/released-assets.txt"
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            # Annotated tags dereference to the commit in Git, not the tag object.
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          fi
          echo "RELEASE_READBACK_OK sha=$GITHUB_SHA tag=$GITHUB_REF_NAME"
  publish-pypi:
    name: Publish PyPI on verified SemVer tag (Trusted Publishing)
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact release commit, never persist Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python release builder
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build CPU-only wheel and standard sdist from tagged source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --sdist --outdir dist
          release_version="$(python -c 'import os; from tools.release_gate import wheel_version; print(wheel_version(os.environ["GITHUB_REF_NAME"]))')"
          python - "$release_version" <<'PY'
          import sys
          from pathlib import Path
          from tools.release_gate import verify_wheel, verify_sdist
          from tools.pypi_index_readback import validate_registry_payload
          version = sys.argv[1]
          files = sorted(Path("dist").iterdir())
          if len(files) != 2:
              raise SystemExit("PUBLIC_DIST_WRONG_FILE_COUNT")
          wheel, = [f for f in files if f.suffix == ".whl"]
          sdist, = [f for f in files if f.name.endswith(".tar.gz")]
          import os
          tag = os.environ["GITHUB_REF_NAME"]
          verify_wheel(wheel, tag)
          verify_sdist(sdist, tag)
          print("PUBLIC_DIST_REAL_WHEEL_SDIST_LICENSE_OK")
          PY
      - name: Publish exact validated artifacts through PyPI Trusted Publisher OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Independently read back PyPI names, version and SHA256 bytes
        run: |
          set -euo pipefail
          release_version="$(python -c 'import os; from tools.release_gate import wheel_version; print(wheel_version(os.environ["GITHUB_REF_NAME"]))')"
          python tools/pypi_index_readback.py --version "$release_version" --dist dist

  recover-v120-github:
    name: Recover immutable v1.2.0 GitHub release without rewriting tag
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recovery_tag == 'v1.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout original tag at immutable SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v1.2.0
          fetch-depth: 0
          persist-credentials: false
      - name: Set up supported Python builder
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate original tag, exact main CI and real release wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: d8c5c2f883d48ee965938abd258790b32f5e6577
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'OuroborosCollective/ARE-SOFTWAREGPU-ENGINE'
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.0" --jq '.object.sha')" = "$RELEASE_SHA"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo 'RELEASE_ALREADY_EXISTS_STOP_FOR_READBACK' >&2
            exit 1
          fi
          python -m pip wheel --no-deps --wheel-dir release-assets .
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/cpu-regressions.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f event=push -f per_page=100 > "$RUNNER_TEMP/cpu-runs.json"
          run_id="$(python tools/release_gate.py --tag v1.2.0 --sha "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY" --runs "$RUNNER_TEMP/cpu-runs.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/cpu-jobs.json"
          python tools/release_gate.py --tag v1.2.0 --sha "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY" --runs "$RUNNER_TEMP/cpu-runs.json" \
            --jobs "$RUNNER_TEMP/cpu-jobs.json" \
            --wheel release-assets/ouroboroscollective_softwaregpu-*.whl
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/public-package-install.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f event=push -f per_page=100 > "$RUNNER_TEMP/package-runs.json"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from tools.release_gate import select_run, verify_jobs
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          runs = json.loads((Path(os.environ["RUNNER_TEMP"]) / "package-runs.json").read_text())
          run_id = select_run(runs, sha, repo)
          payload = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"], text=True))
          verify_jobs(payload, run_id, minimum=4)
          names = [j["name"] for j in payload["jobs"]]
          for platform in ("ubuntu-latest", "windows-latest"):
              for version in ("3.11", "3.12"):
                  if not any(platform in n and "Python " + version in n for n in names):
                      raise SystemExit("MISSING_INSTALLED_PACKAGE_MATRIX")
          print("RECOVERY_EXACT_MAIN_PACKAGE_MATRIX_OK", run_id)
          PY
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: Retain Git dirty-tree verification while ignoring generated release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DISCORD_ANNOUNCE: 'false'
        run: |
          set -euo pipefail
          # Worktree-local Git exclude, not a global bypass of GoReleaser validation.
          printf '\n/release-assets/\n' >> .git/info/exclude
          test -z "$(git status --porcelain --untracked-files=normal)"
          goreleaser release --clean
      - name: Read back real GitHub release and its immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: d8c5c2f883d48ee965938abd258790b32f5e6577
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.0" --jq '.object.sha')" = "$RELEASE_SHA"
          gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false
          gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/released.txt"
          grep -E '^ouroboroscollective_softwaregpu-1[.]2[.]0-.*[.]whl$' "$RUNNER_TEMP/released.txt"
          grep -Fx 'checksums.txt' "$RUNNER_TEMP/released.txt"
          grep -E '[.]tar[.]gz$' "$RUNNER_TEMP/released.txt"
          echo "RECOVERED_GITHUB_RELEASE_READBACK_OK sha=$RELEASE_SHA tag=v1.2.0"

  recover-v120-pypi:
    name: Recover immutable v1.2.0 PyPI artifacts (Trusted Publishing)
    needs: recover-v120-github
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.recovery_tag == 'v1.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout original v1.2.0 tag and exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v1.2.0
          persist-credentials: false
      - name: Set up Python build
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build genuine wheel and source archive from immutable tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd8c5c2f883d48ee965938abd258790b32f5e6577'
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --sdist --outdir dist
          python - <<'PY'
          from pathlib import Path
          from tools.release_gate import verify_wheel, verify_sdist
          files = list(Path("dist").iterdir())
          if len(files) != 2:
              raise SystemExit("WRONG_RELEASE_ARTIFACT_COUNT")
          wheel, = [p for p in files if p.suffix == ".whl"]
          sdist, = [p for p in files if p.name.endswith(".tar.gz")]
          verify_wheel(wheel, "v1.2.0")
          verify_sdist(sdist, "v1.2.0")
          print("IMMUTABLE_V120_PYPI_ARTIFACTS_VERIFIED")
          PY
      - name: Publish only authentic v1.2.0 artifacts with PyPI OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Independently read back PyPI SHA256 digests of both artifacts
        run: python tools/pypi_index_readback.py --version 1.2.0 --dist dist
