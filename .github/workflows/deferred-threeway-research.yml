name: Deferred visibility 3-way ablation
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/compare_deferred_threeway.py'
      - 'software_gpu/tests/test_deferred_threeway.py'
      - '.github/workflows/deferred-threeway-research.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deferred-threeway-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    name: Scalar, batch-first, deferred byte-exact parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Real RGBA and float32 depth parity plus negative receipt controls
        run: python -m unittest software_gpu.tests.test_deferred_threeway -v

  real-ablation:
    needs: parity
    name: 15-pair balanced 3-way 96px CPU ablation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Real serial A/B/C, three scenes including near-first and far-first
        run: python -m software_gpu.benchmarks.compare_deferred_threeway --output "$RUNNER_TEMP/threeway/benchmark.json" --pixels 96 --workers 2 --repeats 15
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: deferred-threeway-${{ github.sha }}
          path: ${{ runner.temp }}/threeway/benchmark.json
          if-no-files-found: error
          retention-days: 30
