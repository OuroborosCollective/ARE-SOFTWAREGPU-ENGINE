# Read-only, one-shot public PyPI 1.2.0 registry + real cross-platform installation receipt.
name: Public PyPI v1.2.0 registry digest and pip installation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pypi-v120.yml'

permissions:
  contents: read

jobs:
  public-registry-install:
    name: PyPI public install / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Independent public PyPI registry readback against original OIDC publish log digests
        shell: python
        run: |
          import json
          from urllib.request import Request, urlopen
          url = "https://pypi.org/pypi/ouroboroscollective-softwaregpu/1.2.0/json"
          with urlopen(Request(url, headers={"Accept": "application/json"}), timeout=30) as response:
              assert response.status == 200
              data = json.loads(response.read(2_000_000))
          assert data["info"]["name"].lower().replace("_", "-") == "ouroboroscollective-softwaregpu"
          assert data["info"]["version"] == "1.2.0"
          expected = {
              "ouroboroscollective_softwaregpu-1.2.0-py3-none-any.whl":
                  "ad6eea84bf34fb2927c497ebc823cf1e5b9d7f3eb319c686c54f8509ebbf7e8c",
              "ouroboroscollective_softwaregpu-1.2.0.tar.gz":
                  "4b96f80e8e674570a956807cf76ec10acb796ab3a514ae4286a698d04b8e84a2",
          }
          entries = data["urls"]
          assert len(entries) == 2
          assert {i["filename"] for i in entries} == set(expected)
          for file in entries:
              assert file.get("yanked") is not True
              assert file["digests"]["sha256"] == expected[file["filename"]]
          print("PUBLIC_PYPI_V120_REGISTRY_SHA256_READBACK_OK", data["info"]["name"])
      - name: Install actual public PyPI package into clean GitHub runner Python
        run: python -m pip install --no-cache-dir --index-url https://pypi.org/simple ouroboroscollective-softwaregpu==1.2.0
      - name: Validate imported package revision and public CLI
        shell: python
        run: |
          import importlib.metadata as metadata
          import software_gpu
          from software_gpu import SoftwareRasterizer
          assert software_gpu.__version__ == "1.2.0"
          assert metadata.version("ouroboroscollective-softwaregpu") == "1.2.0"
          print("PUBLIC_PYPI_IMPORT_RUNTIME_OK")
      - name: Verify installed CLI
        run: software-gpu --help
