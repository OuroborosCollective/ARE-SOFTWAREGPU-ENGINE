name: MIHA CPU training
on:
  push:
    branches: [miha/cpu-training-20261009]
    paths:
      - '.github/workflows/miha-cpu-training.yml'
      - 'scripts/miha_cpu_runner.py'
      - 'fixtures/miha/**'
      - 'software_gpu/training/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/miha-cpu-training.yml'
      - 'scripts/miha_cpu_runner.py'
      - 'fixtures/miha/**'
      - 'software_gpu/training/**'
      - 'software_gpu/tests/test_training_metrics.py'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Input audit only, or full CPU training after all gates'
        type: choice
        options: [train, audit]
        default: train
      runner:
        description: 'Standard runner checks actual RAM; self-hosted requires cpu/miha-32g labels'
        type: choice
        options: [ubuntu-24.04, self-hosted-cpu-32g]
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: miha-cpu-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  ACCELERATOR: cpu
  CUDA_VISIBLE_DEVICES: ''
  HIP_VISIBLE_DEVICES: ''
  ROCR_VISIBLE_DEVICES: ''
  HF_HUB_DISABLE_XET: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  integration:
    name: Canonical / Atomic readback and renderer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install audit and CPU renderer dependencies
        run: python -m pip install -e . 'huggingface_hub==0.35.3'
      - name: Actual rasterizer and hash regressions
        run: python -m unittest software_gpu.tests.test_training_metrics -v
      - name: Rebuild all pinned canonical training examples and compare Atomic bytes
        run: python -u scripts/miha_cpu_runner.py audit --output miha-audit
      - name: Seal audit receipts
        if: always()
        run: python scripts/miha_cpu_runner.py seal --output miha-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: miha-input-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: miha-audit/
          retention-days: 14

  training:
    name: Full CPU LoRA, memory and longest-example gates
    needs: integration
    if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[miha-train]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'train')
    runs-on: ${{ inputs.runner == 'self-hosted-cpu-32g' && fromJSON('["self-hosted","linux","x64","cpu","miha-32g"]') || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check real RAM before installing ML or loading model weights
        run: python -u scripts/miha_cpu_runner.py preflight --output miha-run
      - name: Install pinned CPU ML runtime and actual renderer
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from urllib.request import urlopen
          from pathlib import Path
          settings = json.loads(Path('fixtures/miha/training.json').read_text())
          uri = 'https://huggingface.co/Thorsu/miha-deepseek-r1-distill-qwen-7b-lora/resolve/' + settings['code_revision'] + '/requirements-cpu.txt'
          with urlopen(uri, timeout=60) as response:
              Path('miha-run/requirements-cpu.txt').write_bytes(response.read())
          subprocess.run([sys.executable, '-m', 'pip', 'install', '-r', 'miha-run/requirements-cpu.txt', '-e', '.'], check=True)
          PY
      - name: Train all examples, save checkpoints and render actual loss observations
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 19000s python -u scripts/miha_cpu_runner.py train --output miha-run --renderer-revision "$GITHUB_SHA" 2>&1 | tee miha-run/training.log
      - name: Publish candidate to Hugging Face if an existing HF_TOKEN is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MIHA_PREFIX: actions/run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          if os.environ.get('HF_TOKEN'):
              subprocess.run([sys.executable, 'scripts/miha_cpu_runner.py', 'publish', '--output', 'miha-run', '--prefix', os.environ['MIHA_PREFIX']], check=True)
          else:
              Path('miha-run/publication.json').write_text(json.dumps({'status': 'skipped_missing_hf_token', 'hub_readback': False, 'success': False}) + '\n')
              print('Candidate remains available as a GitHub artifact; HF_TOKEN is not configured.')
          PY
      - name: Seal diagnostic, checkpoint and candidate artifacts
        if: always()
        run: python scripts/miha_cpu_runner.py seal --output miha-run
      - name: Report observed training state
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### MIHA CPU training status\n\n')
              for name in ['preflight.json', 'candidate/adapter/training_manifest.json', 'publication.json']:
                  path = Path('miha-run') / name
                  if path.exists():
                      doc = json.loads(path.read_text())
                      fields = {k: doc[k] for k in ['memory_gate', 'blocker', 'training_completed', 'optimizer_steps', 'status', 'hub_readback', 'success'] if k in doc}
                      summary.write('`' + name + '`\n\n```json\n' + json.dumps(fields, indent=2) + '\n```\n\n')
              summary.write('A candidate requires adapter reload, complete held-out benchmark and readback before acceptance.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: miha-cpu-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: miha-run/
          retention-days: 14
