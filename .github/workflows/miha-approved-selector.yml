name: MIHA approved Atomic selector regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/training/auto_incremental.py'
      - 'software_gpu/tests/test_auto_approved_selector.py'
      - 'scripts/miha_auto_select.py'
      - '.github/workflows/miha-approved-selector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approved-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned and newer-Evidence negative admission tests
        run: python -m unittest software_gpu.tests.test_auto_approved_selector software_gpu.tests.test_auto_incremental -v
      - name: Syntax and code import
        run: python -m compileall -q scripts/miha_auto_select.py software_gpu/training/auto_incremental.py
