name: Public Python distribution install (Windows/Linux)

on:
  pull_request:
    branches: [main]
    paths:
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'docs/PYPI_PACKAGE.md'
      - '.github/workflows/goreleaser.yml'
      - '.github/workflows/public-package-install.yml'
      - 'tools/release_gate.py'
      - 'tools/pypi_index_readback.py'
      - 'tools/verify_dist_install.py'
      - 'software_gpu/tests/test_public_package_release.py'
      - 'software_gpu/tests/test_release_gate.py'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-installed-wheel:
    name: Real installed wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout exact source without retaining credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install supported Python toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install real build system
        run: python -m pip install --disable-pip-version-check build numpy
      - name: Run fail-closed package and release contract tests
        run: python -m unittest software_gpu.tests.test_public_package_release software_gpu.tests.test_release_gate -v
      - name: Build real wheel and source distribution
        run: python -m build --wheel --sdist --outdir dist
      - name: Verify wheel/sdist and install wheel outside checkout
        run: python tools/verify_dist_install.py --dist dist
