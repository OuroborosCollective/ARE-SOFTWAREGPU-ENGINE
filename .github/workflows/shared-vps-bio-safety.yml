name: Shared VPS Bio host safety (no host access)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/vps_bio_host.py'
      - 'software_gpu/tests/test_vps_bio_host.py'
      - '.github/workflows/shared-vps-bio-safety.yml'
permissions:
  contents: read
jobs:
  dry-contract:
    name: Admission denial and bounded host profiles
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3'
      - run: python -m unittest software_gpu.tests.test_vps_bio_host -v
      - run: python -m py_compile tools/vps_bio_host.py
