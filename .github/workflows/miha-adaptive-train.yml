name: MIHA adaptive CPU training
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only latest approved Atomic audit, or explicitly launch CPU training'
        type: choice
        options: [audit, train]
        default: audit
      runner:
        description: 'Training requires real 16-GiB+ CPU RAM; self-hosted must carry cpu/miha-32g labels'
        type: choice
        options: [self-hosted-cpu-32g, ubuntu-24.04]
        default: self-hosted-cpu-32g
      atomic_revision:
        description: 'Optional immutable 40-char reviewed Atomic SHA; empty resolves latest Hub revision'
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: miha-adaptive-train-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  ACCELERATOR: cpu
  CUDA_VISIBLE_DEVICES: ''
  HIP_VISIBLE_DEVICES: ''
  ROCR_VISIBLE_DEVICES: ''
  HF_HUB_DISABLE_XET: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'

jobs:
  audited-cpu:
    name: Immutable latest Atomic -> audit -> opt-in CPU LoRA
    runs-on: ${{ inputs.runner == 'self-hosted-cpu-32g' && fromJSON('["self-hosted","linux","x64","cpu","miha-32g"]') || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install audited CPU renderer and pinned Hub readback client
        run: python -m pip install --disable-pip-version-check -e . 'huggingface_hub==0.35.3'
      - name: Resolve latest approved immutable Atomic revision without editing repository configuration
        shell: bash
        env:
          REQUESTED_ATOMIC_SHA: ${{ inputs.atomic_revision }}
        run: |
          if [ -n "$REQUESTED_ATOMIC_SHA" ]; then
            python -m scripts.miha_auto_select --atomic-revision "$REQUESTED_ATOMIC_SHA" --output miha-adaptive-select
          else
            python -m scripts.miha_auto_select --output miha-adaptive-select
          fi
      - name: Validate exact frozen config and mandatory audited-release receipt
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('miha-adaptive-select/resolution.json').read_text())
          digest=r.pop('sha256')
          assert digest == hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert r['status']=='AUDIT_REQUIRED'
          assert r['training_started'] is False and r['release_accepted'] is False
          cfg=json.loads(Path('miha-adaptive-select/training.json').read_text())
          assert cfg['atomic_revision']==r['atomic_revision']
          assert cfg['evidence_revision']==r['evidence_revision']
          print('MIHA_DYNAMIC_SNAPSHOT_READBACK_OK',digest)
          PY
      - name: Rebuild entire pinned canonical corpus and independently verify published Atomic bytes
        run: python -u scripts/miha_cpu_runner.py audit --config miha-adaptive-select/training.json --output miha-adaptive-select/audit
      - name: Verify actual CPU RAM, base pins and training policy before model weights
        if: inputs.mode == 'train'
        run: python -u scripts/miha_cpu_runner.py preflight --config miha-adaptive-select/training.json --output miha-adaptive-select/run
      - name: Install pinned CPU ML dependencies only after successful preflight
        if: inputs.mode == 'train'
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          from urllib.request import urlopen
          settings=json.loads(Path('miha-adaptive-select/training.json').read_text())
          url='https://huggingface.co/Thorsu/miha-deepseek-r1-distill-qwen-7b-lora/resolve/'+settings['code_revision']+'/requirements-cpu.txt'
          with urlopen(url,timeout=60) as response:
              Path('miha-adaptive-select/run/requirements-cpu.txt').write_bytes(response.read())
          subprocess.run([sys.executable,'-m','pip','install','-r','miha-adaptive-select/run/requirements-cpu.txt','-e','.'],check=True)
          PY
      - name: Train one fully pinned snapshot with assistant-only loss (explicit train mode only)
        if: inputs.mode == 'train'
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 19000s python -u scripts/miha_cpu_runner.py train --config miha-adaptive-select/training.json --output miha-adaptive-select/run --renderer-revision "$GITHUB_SHA" 2>&1 | tee miha-adaptive-select/run/training.log
      - name: Seal diagnostics, exact source pins and optional private candidate
        if: always()
        run: python scripts/miha_cpu_runner.py seal --output miha-adaptive-select
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: miha-adaptive-training-${{ github.run_id }}-${{ github.run_attempt }}
          path: miha-adaptive-select/
          if-no-files-found: warn
          retention-days: 30
