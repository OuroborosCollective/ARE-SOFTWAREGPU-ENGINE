name: Aurion offline GLB contract
on:
  pull_request:
    branches: [main]
    paths:
      - software_gpu/integrations/aurion/**
      - software_gpu/tests/test_aurion_*.py
      - fixtures/aurion/**
      - .github/workflows/aurion-offline-glb.yml
  push:
    branches: [main]
    paths:
      - software_gpu/integrations/aurion/**
      - software_gpu/tests/test_aurion_*.py
      - fixtures/aurion/**
      - .github/workflows/aurion-offline-glb.yml
permissions:
  contents: read
jobs:
  offline:
    name: CPU GLB / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "numpy>=1.20,<3"
      - name: Real CPU rendering and security tests
        run: python -m unittest software_gpu.tests.test_aurion_offline_lod software_gpu.tests.test_aurion_original_batch2 software_gpu.tests.test_aurion_npc_fallback software_gpu.tests.test_aurion_production_male -v
      - name: Offline worker CLI import
        run: python -m software_gpu.integrations.aurion.offline_lod_worker --help
      - name: NPC original verification CLI import
        run: python -m software_gpu.integrations.aurion.npc_fallback_audit --help
