name: Shared VPS Bio safety gate (no VPS access)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/vps_bio_host.py'
      - 'software_gpu/tests/test_vps_bio_host.py'
      - '.github/workflows/shared-vps-bio-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardrail-tests:
    name: VPS admission negative tests (no SSH or remote mutation)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Real admission tests with simulated P0 host pressure (no render)
        run: python -m unittest software_gpu.tests.test_vps_bio_host -v
      - name: Syntax and CLI admission boundaries
        run: |
          python -m py_compile tools/vps_bio_host.py
          python tools/vps_bio_host.py --help
