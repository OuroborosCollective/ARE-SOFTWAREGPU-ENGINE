name: Real SPIR-V SSA -> ARE tiles execution (not Vulkan ICD)
on:
  pull_request:
    branches: [main, 'feat/spirv-*']
    paths:
      - 'software_gpu/drivers/spirv_opcode_executor.py'
      - 'software_gpu/drivers/spirv_execution_smoke.py'
      - 'software_gpu/tests/test_spirv_opcode_execution.py'
      - '.github/workflows/spirv-ssa-tiles.yml'
  push:
    branches: [main, 'feat/spirv-*']
    paths:
      - 'software_gpu/drivers/spirv_opcode_executor.py'
      - 'software_gpu/drivers/spirv_execution_smoke.py'
      - 'software_gpu/tests/test_spirv_opcode_execution.py'
      - '.github/workflows/spirv-ssa-tiles.yml'
      - 'Memory.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ssa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Genuine validated SPIR-V instructions -> real ARE tile pixels
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install independent genuine shader tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslang-tools spirv-tools
          python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Negative gates for unvalidated and unsupported bytecode
        run: python -m unittest software_gpu.tests.test_spirv_opcode_execution -v
      - name: Produce real validated GLSL->SPIR-V shader binaries
        run: |
          set -eu
          mkdir -p evidence-local/spirv-ssa
          glslangValidator -V --target-env vulkan1.2 -S vert software_gpu/drivers/shader_probe.vert -o evidence-local/spirv-ssa/vertex.spv
          glslangValidator -V --target-env vulkan1.2 -S frag software_gpu/drivers/shader_probe.frag -o evidence-local/spirv-ssa/fragment.spv
          spirv-val --target-env vulkan1.2 evidence-local/spirv-ssa/vertex.spv
          spirv-val --target-env vulkan1.2 evidence-local/spirv-ssa/fragment.spv
      - name: Execute actual shader instructions through ARE tile renderer
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m software_gpu.drivers.spirv_execution_smoke --vertex evidence-local/spirv-ssa/vertex.spv --fragment evidence-local/spirv-ssa/fragment.spv --expected-revision "$SOURCE_HEAD" --output evidence-local/spirv-ssa/receipt.json
      - name: Archive compiled bytecode and actual frame/depth receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-spirv-ssa-tiles-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-local/spirv-ssa/
          if-no-files-found: ignore
          retention-days: 30
