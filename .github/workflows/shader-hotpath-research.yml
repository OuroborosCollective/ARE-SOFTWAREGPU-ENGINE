name: CPU shader hotpath research
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/graphics/shader.py'
      - 'software_gpu/graphics/batch_shader.py'
      - 'software_gpu/tests/test_shader_clamp_optimizations.py'
      - 'software_gpu/benchmarks/compare_shader_hotpaths.py'
      - '.github/workflows/shader-hotpath-research.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: shader-hotpath-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-measure:
    name: RGB/Depth parity and real 15-pair CPU shader measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install same real CPU NumPy dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3' 'Pillow>=9'
      - name: Exact shader numeric and real framebuffer regression tests
        run: python -m unittest software_gpu.tests.test_shader_clamp_optimizations -v
      - name: Existing full Blinn-Phong frame and depth equivalence
        run: python -m unittest software_gpu.tests.test_shader_half_vector_cache -v
      - name: Fifteen alternating actual CPU A/B pairs
        run: python -m software_gpu.benchmarks.compare_shader_hotpaths --output "${{ runner.temp }}/shader-hotpath/report.json" --repeats 15
      - name: Verify receipt digest, source identity, raw timings and alternation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - "${{ runner.temp }}/shader-hotpath/report.json" <<'PY'
          import hashlib, json, os, pathlib, statistics, sys
          report=json.loads(pathlib.Path(sys.argv[1]).read_text())
          checksum=report.pop('sha256')
          body=json.dumps(report,sort_keys=True,ensure_ascii=False,separators=(',',':'),allow_nan=False).encode()
          assert hashlib.sha256(body).hexdigest()==checksum
          assert report['source_head']==os.environ['EXPECTED_HEAD']
          assert report['repeats']==15
          for path,digest in report['source_sha256'].items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==digest
          for name,case in report['cases'].items():
              pairs=case['pairs']
              assert len(pairs)==15
              assert all(p['order'] == (['reference','optimized'] if i%2==0 else ['optimized','reference'])
                         for i,p in enumerate(pairs))
              assert all(p['baseline_ms']>0 and p['candidate_ms']>0 for p in pairs)
              assert statistics.median(p['baseline_ms']/p['candidate_ms'] for p in pairs)==case['median_paired_ratio']
              assert sum(p['candidate_ms']<p['baseline_ms'] for p in pairs)==case['candidate_faster_pairs']
              print('SHADER_REAL_CPU_AB',name,
                    'paired_ratio',round(case['median_paired_ratio'],4),
                    'faster_pairs',case['candidate_faster_pairs'],'/15')
          print('SHADER_CPU_RECEIPT_READBACK_OK',checksum)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shader-hotpaths-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shader-hotpath/report.json
          if-no-files-found: error
          retention-days: 30
