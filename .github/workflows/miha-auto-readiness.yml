name: MIHA Auto dataset readiness
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/training/auto_readiness.py'
      - 'software_gpu/tests/test_auto_readiness.py'
      - '.github/workflows/miha-auto-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: miha-auto-readiness-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    name: Live Auto versus pinned Atomic input inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned HF client and actual renderer dependencies
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3' 'numpy>=1.20,<3' 'Pillow>=9'
      - name: Real canonical inventory and negative drift tests
        run: python -m unittest software_gpu.tests.test_auto_readiness -v
      - name: Compare current live Auto SHA with approved canonical release
        run: python -m software_gpu.training.auto_readiness --output "$RUNNER_TEMP/miha-auto/readiness.json"
      - name: Verify receipt SHA and no training started
        run: |
          python - "$RUNNER_TEMP/miha-auto/readiness.json" <<'PY'
          import hashlib, json, sys
          receipt = json.load(open(sys.argv[1]))
          claimed = receipt.pop('sha256')
          digest = hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert digest == claimed
          assert receipt['training_started'] is False and receipt['release_accepted'] is False
          assert receipt['status'] in ('AUTO_REFRESH_REQUIRED','PINNED_CURRENT','AUTO_SOURCE_INVALID')
          assert receipt['atomic_approved_for_live_auto'] is False
          if receipt['status'] == 'AUTO_SOURCE_INVALID':
              assert receipt.get('diagnostic','').startswith('AUTO_INVENTORY:')
              print('MIHA_AUTO_BLOCKED_INVALID_SOURCE', receipt['diagnostic'])
          print('MIHA_AUTO_READBACK_OK', receipt['status'], claimed)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: miha-auto-readiness-${{ github.sha }}
          path: ${{ runner.temp }}/miha-auto/readiness.json
          if-no-files-found: ignore
          retention-days: 30
