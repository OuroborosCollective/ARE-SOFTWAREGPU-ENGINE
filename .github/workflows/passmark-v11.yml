name: PassMark V11 CPU and memory contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/passmark-v11.yml"
      - "tools/passmark_v11.py"
      - "software_gpu/tests/test_passmark_v11.py"
      - "docs/PASSMARK_V11.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passmark-v11.yml"
      - "tools/passmark_v11.py"
      - "software_gpu/tests/test_passmark_v11.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passmark-contract:
    name: PassMark V11 pinned archive and receipt contract (no vendor execution)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install project test dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Verify fail-closed archive and result contracts
        run: python -m unittest software_gpu.tests.test_passmark_v11 -v
      - name: Compile PassMark host runner
        run: python -m py_compile tools/passmark_v11.py
