name: MIHA adaptive Auto preparation
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/training/auto_incremental.py'
      - 'software_gpu/tests/test_auto_incremental.py'
      - 'scripts/miha_auto_prepare.py'
      - '.github/workflows/miha-adaptive-auto.yml'

permissions:
  contents: read
concurrency:
  group: miha-adaptive-auto-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Immutable Evidence snapshot and bounded replay plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install real pinned HF and renderer imports (no model weights)
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3' 'numpy>=1.20,<3' 'Pillow>=9'
      - name: Verify immutable incremental release and full replay tests
        run: python -m unittest software_gpu.tests.test_auto_incremental -v
      - name: Prepare current canonical Evidence release and Atomic candidate
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python -m scripts.miha_auto_prepare --renderer-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/miha-adaptive"
      - name: Read back exact SHA-bound release plan and enforce zero training
        run: |
          python - "$RUNNER_TEMP/miha-adaptive/plan.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          digest=r.pop('sha256')
          assert hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==digest
          assert r['training_started'] is False and r['release_accepted'] is False
          assert r['approved_atomic_revision'] is None
          assert r['status'] in ('NO_CHANGE','CANDIDATE_READY_FOR_REVIEW','CORRECTION_REVIEW_REQUIRED','SOURCE_BLOCKED')
          print('MIHA_ADAPTIVE_PLAN_READBACK_OK',r['status'],digest)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: miha-adaptive-candidate-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/miha-adaptive/
          if-no-files-found: warn
          retention-days: 30
