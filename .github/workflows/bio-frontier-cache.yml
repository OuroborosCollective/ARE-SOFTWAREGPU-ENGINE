name: Bio frontier cache research
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/symbolic/bio_workrooms.hpp'
      - 'software_gpu/research/bio_workrooms.py'
      - 'software_gpu/tests/test_bio_frontier_cache_ablation.py'
      - 'tools/benchmark_frontier_cache.py'
      - 'tools/benchmark_frontier_alternating.py'
      - '.github/workflows/bio-frontier-cache.yml'
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run bounded 15-pair native 1/2/4/8 worker research benchmark'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: bio-frontier-cache-${{ github.ref }}-${{ github.event_name }}
  # Supersede an obsolete PR commit, but do not interrupt manual research runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-parity:
    name: Native frontier variants RGBA/Depth parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Real C++17 build for six variants; independent framebuffer and depth oracle
        env:
          ARE_BIO_CACHE_ABLATION_TEST: '1'
        run: python -m unittest software_gpu.tests.test_bio_frontier_cache_ablation -v

  alternating-ab:
    needs: native-parity
    name: Alternating real C++17 AB/BA 15-pair frontier evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Interleave actual default/static native builds across 15 pairs (1/2/4/8 workers)
        run: python tools/benchmark_frontier_alternating.py --output "$RUNNER_TEMP/frontier-abba/benchmark.json" --repeats 15 --workers 1 2 4 8 --max-seconds 600
      - name: Fail-closed digest, order and real receipt readback
        run: python tools/benchmark_frontier_alternating.py --verify "$RUNNER_TEMP/frontier-abba/benchmark.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bio-frontier-alternating-${{ github.sha }}
          path: ${{ runner.temp }}/frontier-abba/benchmark.json
          if-no-files-found: ignore
          retention-days: 30

  paired-pilot:
    needs: alternating-ab
    name: Native cache A/B 15-pair source-bound pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: True native 15-pair default versus static-frontier-chunks (1/2 workers)
        run: python tools/benchmark_frontier_cache.py --output-dir "$RUNNER_TEMP/bio-cache-pilot" --repeats 15 --max-seconds 600 --workers 1 2 --variants default static-frontier-chunks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bio-frontier-cache-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/bio-cache-pilot/benchmark.json
          if-no-files-found: ignore
          retention-days: 30

  sampled-benchmark:
    needs: paired-pilot
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_benchmark)
    name: Bounded native serial worker sweep (diagnostic; noisy CI hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Build and benchmark true native frames serially with hard time budget
        run: python tools/benchmark_frontier_cache.py --output-dir "$RUNNER_TEMP/bio-cache" --repeats 15 --max-seconds 1200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bio-cache-ablations-${{ github.sha }}
          path: ${{ runner.temp }}/bio-cache/benchmark.json
          if-no-files-found: ignore
          retention-days: 30
