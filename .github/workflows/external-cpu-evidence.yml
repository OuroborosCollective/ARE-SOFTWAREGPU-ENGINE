name: External CPU renderer evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mesa-llvmpipe:
    name: Mesa llvmpipe / workers ${{ matrix.workers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2, 4, 8]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      EGL_PLATFORM: surfaceless
      LP_NUM_THREADS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU GL/EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libosmesa6
          python -m pip install --disable-pip-version-check -e ".[jit]" "moderngl>=5.12,<6"
      - name: Real CPU benchmark and renderer readback
        run: |
          python -m software_gpu.benchmarks.external_cpu_benchmark --workers ${{ matrix.workers }} --repeats 3 --jit --output evidence-run-workers-${{ matrix.workers }}.json
      - name: Schema and evidence integrity
        run: |
          python -m unittest software_gpu.tests.test_external_cpu_benchmark -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mesa-evidence-workers-${{ matrix.workers }}
          path: evidence-run-workers-${{ matrix.workers }}.json
          if-no-files-found: warn
          retention-days: 14
