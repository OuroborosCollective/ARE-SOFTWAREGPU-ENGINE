name: Import SoftwareGPU source (CPU-only)
on:
  push:
    branches:
      - integration/softwaregpu-v1-2-source
    paths:
      - .github/workflows/import-softwaregpu.yml
      - scripts/import_source_archive.py
      - aistudio_agent_environment-805fd56f-4455-4da9-b5ab-a0fe51f950c8-2026_10_08T17_31_27_601Z.tar
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: softwaregpu-source-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate archive and execute CPU tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Import only pinned UTF-8 source entries
        run: |
          python scripts/import_source_archive.py --archive 'aistudio_agent_environment-805fd56f-4455-4da9-b5ab-a0fe51f950c8-2026_10_08T17_31_27_601Z.tar' --destination .
      - name: Python syntax and unit regressions
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.20,<3'
          python -m compileall -q software_gpu main.py
          python -m unittest discover -s software_gpu/tests -v
      - name: Ensure tests did not modify imported source
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path("evidence/source-manifest.json").read_text())
          assert manifest["source_file_count"] == 62
          for entry in manifest["files"]:
              content = Path(entry["path"]).read_bytes()
              assert hashlib.sha256(content).hexdigest() == entry["sha256"], entry["path"]
          print("SOURCE_READBACK_OK 62/62")
          PY

  publish:
    name: Commit vetted sources only
    needs: verify
    if: github.ref == 'refs/heads/integration/softwaregpu-v1-2-source'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Recreate byte-verified source tree
        run: |
          python scripts/import_source_archive.py --archive 'aistudio_agent_environment-805fd56f-4455-4da9-b5ab-a0fe51f950c8-2026_10_08T17_31_27_601Z.tar' --destination .
          git add -- main.py setup.py software_gpu docs/UPSTREAM_README.md evidence/source-manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'import: source-only SoftwareGPU 1.2.0 after CPU regressions'
      - name: Push only committed source changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff HEAD^ HEAD --name-only | grep -q '^software_gpu/'; then
            git -c credential.helper= push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF}"
          else
            echo "No source commit to publish"
          fi
