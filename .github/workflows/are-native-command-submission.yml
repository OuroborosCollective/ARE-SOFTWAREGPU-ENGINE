name: ARE real CPU command submission admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/drivers/command_submission.py'
      - 'software_gpu/tests/test_native_command_submission.py'
      - '.github/workflows/are-native-command-submission.yml'
  push:
    branches: [main, 'feat/are-native-command-*']
    paths:
      - 'software_gpu/drivers/command_submission.py'
      - 'software_gpu/tests/test_native_command_submission.py'
      - '.github/workflows/are-native-command-submission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-commands:
    name: Native CPU ordered atomic replay / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install required CPU array dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Build genuine C++ raster and verify negative-first command tests
        run: python -m unittest software_gpu.tests.test_native_command_submission software_gpu.tests.test_driver_adapter -v
