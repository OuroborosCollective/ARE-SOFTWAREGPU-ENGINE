name: CPU wave leaderboard
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/spherepop_rankings.py'
      - 'evidence/spherepop-wave-ranked-cpu-20261020.json'
      - 'evidence/single-origin-time-window-20261020.json'
      - 'docs/CPU_WAVE_RANGLISTEN.md'
      - '.github/workflows/cpu-wave-leaderboard.yml'

permissions:
  contents: read

concurrency:
  group: cpu-wave-leaderboard
  cancel-in-progress: false

jobs:
  rankings:
    name: Verify archived leaderboards and measure current CPU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install bounded CPU prerequisites
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Validate immutable historical receipts and documentation
        run: |
          python -m unittest software_gpu.tests.test_spherepop_rankings -v
          python -m software_gpu.benchmarks.spherepop_rankings --check docs/CPU_WAVE_RANGLISTEN.md --json "${RUNNER_TEMP}/historical-ranks.json"
      - name: Run a fresh single-budget 15-pair CPU frame ranking
        run: |
          python -m software_gpu.benchmarks.compare_spherepop_wave_frames --output "${RUNNER_TEMP}/current-wave-raw.json" --pixels 32 64 --repeats 15 --max-seconds 600
          python -m software_gpu.benchmarks.spherepop_rankings --strict-current --wave "${RUNNER_TEMP}/current-wave-raw.json" --markdown "${RUNNER_TEMP}/current-leaderboard.md" --json "${RUNNER_TEMP}/current-leaderboard.json"
      - name: Publish current ranks and historical comparison in job summary
        shell: bash
        run: |
          echo '## Current measured CPU ranks (same runner, 15 samples per mode)' >> "$GITHUB_STEP_SUMMARY"
          cat "${RUNNER_TEMP}/current-leaderboard.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Archived receipt tables remain revision bound; this is a NEW runner measurement, not a same-machine speedup versus history.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-wave-leaderboard-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/historical-ranks.json
            ${{ runner.temp }}/current-wave-raw.json
            ${{ runner.temp }}/current-leaderboard.json
            ${{ runner.temp }}/current-leaderboard.md
          if-no-files-found: error
          retention-days: 90
