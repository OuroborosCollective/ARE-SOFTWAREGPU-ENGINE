name: Code Ontology Companion - static architecture checks
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/code-ontology-companion.yml"
      - "scripts/code_ontology_ci.py"
      - "software_gpu/tests/test_code_ontology_ci.py"
      - "README.md"
      - "evidence/test-series-catalog-v1.json"
      - "docs/CPU_WAVE_RANGLISTEN.md"
      - "Memory.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-static-ontology:
    name: Pinned upstream 0.6.0 / query / impact / history / diff
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout exact proposed revision without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12 (standard-library-only companion runtime)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify local integration contract tests
        run: python -m unittest software_gpu.tests.test_code_ontology_ci -v
      - name: Download official pinned Code Ontology Companion 0.6.0 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/are-companion-upstream"
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 15 --max-time 120 \
            "https://github.com/battle-doll/code-ontology-companion/releases/download/v0.6.0/code-ontology-companion-0.6.0.zip" \
            --output "$RUNNER_TEMP/are-companion-upstream.zip"
          echo "7c0e8f8daa9f4f5ddecce654a425c76c1d3dc664ba18651dc2050bcbb1d8f217  $RUNNER_TEMP/are-companion-upstream.zip" | sha256sum --check --status
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, stat, zipfile
          root = Path(os.environ["RUNNER_TEMP"])
          archive = root / "are-companion-upstream.zip"
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              if not infos or len(infos) > 500 or sum(i.file_size for i in infos) > 40_000_000:
                  raise SystemExit("COMPANION_ZIP_BUDGET_INVALID")
              for item in infos:
                  name = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if (item.filename.startswith("/") or "\\" in item.filename or
                      any(p in (".", "..") for p in name.parts) or
                      stat.S_ISLNK(mode)):
                      raise SystemExit("COMPANION_ZIP_UNSAFE_ENTRY")
              z.extractall(root / "are-companion-upstream")
          print("COMPANION_ARCHIVE_SHA256_AND_PATHS_VERIFIED")
          PY
      - name: Real ARE source scan, exact symbol search, impact and fixture diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/code_ontology_ci.py \
            --bundle "$RUNNER_TEMP/are-companion-upstream" \
            --repo "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/are-ontology-run"
      - name: Declare static-only boundary
        if: always()
        run: |
          echo "The official analyzer neither imports, tests nor runs ARE source."
          echo "Graph/RDF/private workspace NOT uploaded or published."
          echo "C++17 native kernel, execution telemetry, actual FPS and deployment remain UNVERIFIED."
