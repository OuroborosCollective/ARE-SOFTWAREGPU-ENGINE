name: DEV.to technical article

on:
  push:
    branches: [main]
    paths:
      - 'docs/devto/**'
      - 'tools/devto_publish.py'
  workflow_dispatch:
    inputs:
      auth_only:
        description: 'Read-only API-key check; no draft or public article written'
        type: boolean
        required: true
        default: true
      publish:
        description: 'Publish publicly after human review (default creates/updates a draft)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: devto-are-softwaregpu
  cancel-in-progress: false

jobs:
  devto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate article without API access
        run: python tools/devto_publish.py --check
      - name: Synchronize reviewed article with DEV.to
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          PUBLISH_REQUESTED: ${{ inputs.publish && 'true' || 'false' }}
          AUTH_ONLY: ${{ inputs.auth_only && 'true' || 'false' }}
        run: |
          if [ "$AUTH_ONLY" = "true" ]; then
            if [ "$PUBLISH_REQUESTED" = "true" ]; then
              echo "Cannot publish while auth_only is enabled" >&2
              exit 1
            fi
            python tools/devto_publish.py --auth-check
          elif [ "$PUBLISH_REQUESTED" = "true" ]; then
            python tools/devto_publish.py --publish
          else
            python tools/devto_publish.py
          fi
