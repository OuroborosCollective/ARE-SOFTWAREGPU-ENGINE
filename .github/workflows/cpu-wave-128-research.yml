name: CPU wave 128px research
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/compare_spherepop_wave_frames.py'
      - 'software_gpu/benchmarks/spherepop_rankings.py'
      - '.github/workflows/cpu-wave-128-research.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-wave-128-research
  cancel-in-progress: false
jobs:
  wave128:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU prerequisites
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Verify reference ranking regressions
        run: python -m unittest software_gpu.tests.test_spherepop_rankings -v
      - name: Execute real 128px 15-pair benchmark with strict SHA gates
        run: |
          python -m software_gpu.benchmarks.compare_spherepop_wave_frames --output "${RUNNER_TEMP}/wave-128-raw.json" --pixels 128 --repeats 15 --max-seconds 600
          python -m software_gpu.benchmarks.spherepop_rankings --strict-current --wave "${RUNNER_TEMP}/wave-128-raw.json" --markdown "${RUNNER_TEMP}/wave-128-ranking.md" --json "${RUNNER_TEMP}/wave-128-ranking.json"
      - name: Publish measured factors
        shell: bash
        run: |
          cat "${RUNNER_TEMP}/wave-128-ranking.md" >> "$GITHUB_STEP_SUMMARY"
          echo '128px research only. Do not compare across CPU hosts as same-run speedups.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-wave-128-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wave-128-raw.json
            ${{ runner.temp }}/wave-128-ranking.json
            ${{ runner.temp }}/wave-128-ranking.md
          if-no-files-found: error
          retention-days: 90
