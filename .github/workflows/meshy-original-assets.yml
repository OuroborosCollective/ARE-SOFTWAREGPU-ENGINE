name: Original Meshy GLB asset readback (no VPS)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/meshy_originals.py'
      - 'software_gpu/tests/test_meshy_originals.py'
      - 'evidence/meshy-public-assets-20261013.json'
      - '.github/workflows/meshy-original-assets.yml'
  workflow_dispatch:
    inputs:
      fetch_public_originals:
        type: boolean
        description: "Verify external original GLBs by downloading and checking SHA256"
        default: true

permissions:
  contents: read
jobs:
  manifest-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest software_gpu.tests.test_meshy_originals -v
  original-download-readback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_public_originals == true }}
    needs: manifest-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Network-bound SHA256 verification of original 2 accessible GLB sources
        run: python tools/meshy_originals.py --output-dir "$RUNNER_TEMP/meshy-originals" --receipt "$RUNNER_TEMP/meshy-readback.json"
      - name: Recheck without network
        run: python tools/meshy_originals.py --verify-only --output-dir "$RUNNER_TEMP/meshy-originals"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: meshy-sha256-receipts-${{ github.sha }}
          path: ${{ runner.temp }}/meshy-readback.json
          if-no-files-found: ignore
          retention-days: 30
