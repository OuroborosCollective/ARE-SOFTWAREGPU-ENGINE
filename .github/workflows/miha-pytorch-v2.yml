name: MIHA PyTorch V2 contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/training/v2_contracts.py'
      - 'software_gpu/tests/test_training_v2_contracts.py'
      - 'scripts/miha_v2.py'
      - '.github/workflows/miha-pytorch-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: miha-pytorch-v2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  v2-contracts:
    name: Pinned V2 planning, checkpoint, holdout and GPU-denial
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install actual base renderer imports
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9"
      - name: Actual file/checkpoint contract regressions (no model downloads)
        run: python -m unittest software_gpu.tests.test_training_v2_contracts -v
      - name: Read-only immutable 9-way LoRA optimization plan
        run: |
          python -m scripts.miha_v2 plan --renderer-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/miha-v2-plan.json"
          python - "$RUNNER_TEMP/miha-v2-plan.json" <<'PY'
          import hashlib, json, sys
          report = json.load(open(sys.argv[1]))
          reported = report.pop('sha256')
          digest = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()).hexdigest()
          assert reported == digest
          assert report['training_started'] is False and len(report['candidates']) == 9
          assert report['gpu_allowed'] is False and report['release_accepted'] is False
          print('MIHA_V2_PLAN_READBACK_OK', digest)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: miha-v2-plan-${{ github.sha }}
          path: ${{ runner.temp }}/miha-v2-plan.json
          if-no-files-found: ignore
          retention-days: 30
