name: Autoloop evidence publisher
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/autoloop_publication.py'
      - 'software_gpu/tests/test_autoloop_publication.py'
      - 'evidence/autoloop/accepted/**'
      - 'evidence/autoloop-accepted-leaderboard-v1.json'
      - '.github/workflows/autoloop-evidence-publisher.yml'
  push:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/autoloop_publication.py'
      - 'software_gpu/tests/test_autoloop_publication.py'
      - 'evidence/autoloop/accepted/**'
      - 'evidence/autoloop-accepted-leaderboard-v1.json'
      - '.github/workflows/autoloop-evidence-publisher.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autoloop-publisher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: CPU receipt contracts and public JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Contract tests (synthetic inputs; no speedup claim)
        run: python -m unittest software_gpu.tests.test_autoloop_publication -v
      - name: Verify public file exactly matches accepted evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m software_gpu.benchmarks.autoloop_publication --check
      - name: Confirm exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
