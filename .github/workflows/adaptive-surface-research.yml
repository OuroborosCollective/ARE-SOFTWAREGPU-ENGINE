name: Adaptive surface policy holdout
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/graphics/**'
      - 'software_gpu/benchmarks/compare_surface_plans.py'
      - 'software_gpu/tests/test_adaptive_surface_plan.py'
      - '.github/workflows/adaptive-surface-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-cpu:
    name: Adaptive 15-pair source-bound CPU holdout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install real CPU renderer dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3' 'Pillow>=9.0'
      - name: Test real geometry, buffer and selector contracts
        run: python -m unittest software_gpu.tests.test_adaptive_surface_plan -v
      - name: Measure opt-in adaptive mode alongside unchanged baselines
        run: |
          python -u -m software_gpu.benchmarks.compare_surface_plans \
            --output-dir evidence/adaptive-holdout --pixels 64 --workers 2 \
            --repeats 15 --ablation --adaptive --max-seconds 480
      - name: Audit stored source hashes, selection and color-depth parity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path('evidence/adaptive-holdout/surface-plan-benchmark.json')
          doc = json.loads(path.read_text('utf-8'))
          assert doc['protocol'] == 'are.surface-plan-benchmark.v1'
          assert len(doc['results']) == 5
          for source, digest in doc['source_paths_sha256'].items():
              assert hashlib.sha256(Path(source).read_bytes()).hexdigest() == digest, source
          scenes = {case['scene']: case for case in doc['results']}
          for scene, case in scenes.items():
              assert case['byte_identical'] and case['repeats'] == 15, scene
              assert len(case['samples_ms']['adaptive']) == 15, scene
              assert case['stats_ms']['adaptive']['n'] == 15, scene
              assert case['plans']['adaptive']['selected_route'] in ('batch-first', 'tiles-reference')
          assert scenes['large-surfaces']['plans']['adaptive']['selected_route'] == 'batch-first'
          assert scenes['tiny']['plans']['adaptive']['selected_route'] == 'tiles-reference'
          assert scenes['procedural5k']['plans']['adaptive']['selected_route'] == 'tiles-reference'
          print('ADAPTIVE_SOURCE_BOUND_COLOR_DEPTH_READBACK_OK')
          PY
      - name: Archive tested source for independent local replay
        if: always()
        run: |
          mkdir -p evidence/adaptive-holdout
          git archive HEAD | gzip -n > evidence/adaptive-holdout/source-tree.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: adaptive-surface-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/adaptive-holdout/
          retention-days: 7
