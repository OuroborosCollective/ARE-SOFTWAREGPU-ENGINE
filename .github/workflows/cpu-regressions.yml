name: CPU regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU-only runtime dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Compile Python source
        run: python -m compileall -q software_gpu main.py
      - name: Run real CPU and loopback-network regression tests
        run: python -m unittest discover -s software_gpu/tests -v
      - name: CLI import and help smoke test
        run: python main.py --help
