name: Firefox add-on

on:
  pull_request:
    branches: [main]
    paths:
      - 'clients/firefox-addon/**'
      - 'tools/firefox-addon-tests/**'
      - 'tools/*firefox_addon*.py'
      - 'software_gpu/tests/test_firefox_addon_package.py'
      - 'docs/firefox-addon*.md'
      - '.github/workflows/firefox-addon.yml'
      - 'LICENSE.md'
      - 'NOTICE'
  push:
    branches: [main]
    paths:
      - 'clients/firefox-addon/**'
      - 'tools/firefox-addon-tests/**'
      - 'tools/*firefox_addon*.py'
      - 'software_gpu/tests/test_firefox_addon_package.py'
      - 'docs/firefox-addon*.md'
      - '.github/workflows/firefox-addon.yml'
      - 'LICENSE.md'
      - 'NOTICE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify full readback and package boundaries
        run: |
          node --version
          node --test tools/firefox-addon-tests/readback.test.mjs
          python -m unittest software_gpu.tests.test_firefox_addon_package -v
      - name: Validate original extension source with Mozilla web-ext
        run: npx --yes web-ext@10.8.0 lint --source-dir clients/firefox-addon --warnings-as-errors
      - name: Build unsigned package and original source archive
        run: python tools/package_firefox_addon.py --output-dir build/firefox-addon
      - name: Preserve exact unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-addon-${{ github.sha }}
          path: build/firefox-addon/
          if-no-files-found: error
