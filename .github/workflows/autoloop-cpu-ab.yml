name: Autoloop CPU A/B (GitHub runner only)
run-name: "ARE CPU A/B s${{ inputs.sweep }} ${{ inputs.candidate }}"
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/autoloop_cpu_ab.py'
      - 'software_gpu/tests/test_autoloop_cpu_ab.py'
      - '.github/workflows/autoloop-cpu-ab.yml'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact pinned baseline commit SHA (40 lowercase hex)
        type: string
        required: true
      candidate:
        description: One of six exact catalog candidate names
        type: string
        required: true
      sweep:
        description: Positive integer sweep number
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: are-autoloop-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-cpu-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install minimal real renderer CPU dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'Pillow>=9.0'
      - name: Verify A/B evidence admission contracts
        run: python -m unittest software_gpu.tests.test_autoloop_cpu_ab -v
      - name: Real frame-buffer CPU A/B (smoke on PR; full 20 profiles on manual dispatch)
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
          EVENT: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CPU_CANDIDATE: ${{ inputs.candidate }}
          CPU_SWEEP: ${{ inputs.sweep }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p "$RUNNER_TEMP/are-autoloop-ab"
          if test "$EVENT" = 'pull_request'; then
            python -m software_gpu.benchmarks.autoloop_cpu_ab --baseline "$BASELINE" --smoke --max-seconds 360 --output "$RUNNER_TEMP/are-autoloop-ab/smoke.json"
          else
            python -m software_gpu.benchmarks.autoloop_cpu_ab --baseline "$BASELINE" --candidate "$CPU_CANDIDATE" --sweep "$CPU_SWEEP" --max-seconds 2400 --output "$RUNNER_TEMP/are-autoloop-ab/raw-600-pairs.json"
          fi
      - name: Preserve bounded raw measured evidence (not a published ranking)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: are-autoloop-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/are-autoloop-ab/
          if-no-files-found: warn
          retention-days: 7
