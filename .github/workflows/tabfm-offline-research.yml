name: TabFM offline research (CPU evidence)
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/research/tabfm_benchmark.py'
      - 'software_gpu/tests/test_tabfm_benchmark.py'
      - 'docs/TABFM_OFFLINE_RESEARCH.md'
      - 'evidence/native-raster-surface-plan-metrics-v1.json'
      - '.github/workflows/tabfm-offline-research.yml'
  workflow_dispatch:
    inputs:
      run_tabfm:
        description: 'Explicitly run optional noncommercial pretrained model on CPU'
        type: boolean
        default: false
      noncommercial_rights_confirmed:
        description: 'Confirm independent rights to noncommercial nonproduction weights'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: tabfm-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Syntax, real receipt validation and negative regression tests
        run: |
          python -m compileall -q software_gpu/research/tabfm_benchmark.py software_gpu/tests/test_tabfm_benchmark.py
          python -m unittest software_gpu.tests.test_tabfm_benchmark -v
      - name: Evaluate real historical CPU measurements (no model download)
        run: |
          mkdir -p tabfm-artifacts
          python -m software_gpu.research.tabfm_benchmark --mode baseline --output tabfm-artifacts/baseline.json
      - name: Verify immutable analysis digest and scene-leakage boundary
        run: |
          python - <<'PY'
          import hashlib, json
          from software_gpu.research.tabfm_benchmark import _canonical
          path = 'tabfm-artifacts/baseline.json'
          report = json.load(open(path, encoding='utf-8'))
          digest = report.pop('report_sha256')
          assert hashlib.sha256(_canonical(report)).hexdigest() == digest
          assert report['status'] == 'PASS' and report['n_rows'] == 40
          assert all(f['held_out_scene'] not in f['training_scenes'] for f in report['folds'])
          print('TABFM_BASELINE_EVIDENCE_OK')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tabfm-baseline-evidence-${{ github.sha }}
          path: tabfm-artifacts/baseline.json
          if-no-files-found: warn
          retention-days: 30

  tabfm-cpu-noncommercial:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tabfm == true && inputs.noncommercial_rights_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARE_TABFM_NONCOMMERCIAL_RESEARCH: '1'
      CUDA_VISIBLE_DEVICES: '-1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install explicitly pinned upstream source (nonproduction only)
        run: |
          python -m pip install --disable-pip-version-check "torch>=2.5,<3"
          python -m pip install --disable-pip-version-check "git+https://github.com/google-research/tabfm.git@fbb665569425fd2f490c6576b3af967876fe11ff#egg=tabfm"
      - name: Execute licensed opt-in TabFM regression on recorded CPU benchmarks
        run: |
          mkdir -p tabfm-artifacts
          python -m software_gpu.research.tabfm_benchmark --mode tabfm --confirm-research-rights --output tabfm-artifacts/tabfm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tabfm-research-evidence-${{ github.sha }}
          path: tabfm-artifacts/tabfm.json
          if-no-files-found: warn
          retention-days: 30
