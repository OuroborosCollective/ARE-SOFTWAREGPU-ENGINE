name: Issue 294 GLB Draco Meshopt paired full pipeline
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/benchmarks/asset_codec_comparison.py'
      - 'software_gpu/tests/test_asset_codec_comparison.py'
      - 'evidence/issue294-asset-codec-sources-v1.json'
      - 'tools/asset-codec-comparison-node/**'
      - '.github/workflows/issue294-asset-codecs.yml'
      - 'Memory.md'
      - 'README.md'
      - 'docs/CPU_WAVE_RANGLISTEN.md'
      - 'evidence/test-series-catalog-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-full-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Install CPU-only Python dependencies
        run: python -m pip install 'numpy>=1.20,<3' 'Pillow>=9.0'
      - name: Install SHA-frozen Node codec toolchain
        run: npm ci --prefix tools/asset-codec-comparison-node --ignore-scripts --no-audit --no-fund
      - name: Download actual SHA-pinned Khronos licensed GLB assets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('evidence/issue294-asset-codec-sources-v1.json').read_text())
          target=pathlib.Path('evidence/issue294-ci/assets')
          target.mkdir(parents=True,exist_ok=True)
          assert manifest['protocol']=='are.asset-codec-sources.v1'
          for rec in manifest['assets']:
              assert rec['source'].startswith('https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/')
              with urllib.request.urlopen(rec['source'],timeout=90) as stream:
                  raw=stream.read(64*1024*1024+1)
              assert len(raw)==rec['bytes']
              assert hashlib.sha256(raw).hexdigest()==rec['sha256']
              (target/(rec['name']+'.glb')).write_bytes(raw)
          print('ORIGINAL_SHA_VALID',len(manifest['assets']))
          PY
      - name: Parser and real native GLB security regressions
        run: python -m unittest software_gpu.tests.test_asset_codec_comparison software_gpu.tests.test_glb_import_resource software_gpu.tests.test_glb_admission_security -v
      - name: 15 paired CPU full-pipeline per native-admitted variant
        run: >-
          python -m software_gpu.benchmarks.asset_codec_comparison
          --manifest evidence/issue294-asset-codec-sources-v1.json
          --asset-dir evidence/issue294-ci/assets
          --codec-bin tools/asset-codec-comparison-node/node_modules/.bin/gltf-transform
          --package-lock tools/asset-codec-comparison-node/package-lock.json
          --output evidence/issue294-ci/are-asset-codec-comparison-v1.json
          --repeats 15 --pixels 64 --workers 1
      - name: Fail-closed receipt and source audit
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          doc=json.loads(pathlib.Path('evidence/issue294-ci/are-asset-codec-comparison-v1.json').read_text())
          sha=doc.pop('receipt_sha256')
          body=json.dumps(doc,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          assert hashlib.sha256(body).hexdigest()==sha
          assert doc['protocol']=='are.asset-codec-comparison.v1'
          assert doc['repeats']==15 and doc['ranklist_promotion'] is False
          for name,h in doc['source_paths_sha256'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==h
          for asset in doc['assets']:
              assert len(asset['variants'])==3
              for variant in asset['variants'].values():
                  if variant['status']=='UNSUPPORTED':
                      assert not variant['samples'] and variant['comparable'] is False
                  else:
                      assert len(variant['samples'])==15
                      assert variant['paired_timing']['n']==15
                      assert len(set(x['full_frame_digest'] for x in variant['samples']))==1
          print('CODEC_SHA_RECEIPT_PASS',sha)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: issue294-asset-codec-evidence
          path: evidence/issue294-ci/are-asset-codec-comparison-v1.json
          retention-days: 30
  windows-negative-contract:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU-only Python dependencies
        run: python -m pip install "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Windows negative GLB and test catalog
        run: python -m unittest software_gpu.tests.test_asset_codec_comparison software_gpu.tests.test_test_series_catalog -v

