name: Issue 285 opt-in CPU material full-frame A/B evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/graphics/render_profiles.py'
      - 'software_gpu/graphics/tile_backend.py'
      - 'software_gpu/benchmarks/benchmark_optin_materials.py'
      - 'software_gpu/tests/test_optin_cpu_materials.py'
      - '.github/workflows/issue285-cpu-material-frames.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-material-frames:
    name: Real opt-in CPU full frames / 15 pairs / SHA audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU-only renderer dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3' 'Pillow>=9.0'
      - name: Real geometry, alpha/depth, linear blend and shadow regression
        run: python -m unittest software_gpu.tests.test_optin_cpu_materials -v
      - name: Capture complete frame pair distributions and fingerprints
        run: |
          mkdir -p evidence/issue285-ci
          python -u -m software_gpu.benchmarks.benchmark_optin_materials --pixels 64 --pairs 15 --output evidence/issue285-ci/cpu-material-15-pair.json
      - name: Independently verify receipt digest, SHA and real 15 pair frames
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, math, os, pathlib, subprocess
          p = pathlib.Path('evidence/issue285-ci/cpu-material-15-pair.json')
          receipt = json.loads(p.read_text())
          claimed = receipt.pop('sha256')
          raw = json.dumps(receipt, sort_keys=True, separators=(',', ':'), allow_nan=False)
          assert claimed == hashlib.sha256(raw.encode()).hexdigest(), 'RECEIPT_DIGEST_DRIFT'
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['EXPECTED_HEAD'] == receipt['head_sha'], 'HEAD_MISMATCH'
          assert receipt['pairs'] == 15 and receipt['pixels'] == 64, 'FRAME_PAIRS_INCOMPLETE'
          assert receipt['semantics_comparable']['legacy_vs_alpha_test'], 'OPAQUE_PARITY_FAILURE'
          assert not receipt['semantics_comparable']['legacy_vs_blend'], 'INVALID_BLEND_PARITY_CLAIM'
          for row in receipt['timings_ms'].values():
              assert len(row['raw']) == 15 and all(math.isfinite(x) and x > 0 for x in row['raw'])
          for f in receipt['full_frame_fingerprints'].values():
              for path, digest in f['source_sha256'].items():
                  assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest
              assert all(len(f[field]) == 64 for field in ('rgba_sha256', 'depth_sha256'))
          receipt['sha256'] = claimed
          print('CPU_MATERIAL_15_PAIRS_VALIDATED', sha, claimed)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: issue285-cpu-material-15-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/issue285-ci/
          if-no-files-found: ignore
          retention-days: 30
