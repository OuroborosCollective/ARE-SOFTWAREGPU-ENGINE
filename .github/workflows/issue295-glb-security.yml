name: Issue 295 GLB2 admission security

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue295-glb-security.yml'
      - 'software_gpu/integrations/aurion/offline_lod_worker.py'
      - 'software_gpu/integrations/worldforge.py'
      - 'software_gpu/tests/test_glb_admission_security.py'
      - 'software_gpu/tests/test_glb_import_resource.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue295-glb-security.yml'
      - 'software_gpu/integrations/aurion/offline_lod_worker.py'
      - 'software_gpu/integrations/worldforge.py'
      - 'software_gpu/tests/test_glb_admission_security.py'
      - 'software_gpu/tests/test_glb_import_resource.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-python-import:
    name: GLB2 guard / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline CPU import requirements
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3" "Pillow>=9.0"
      - name: Print exact source revision and interpreter
        run: |
          git rev-parse HEAD
          python --version
      - name: Check real GLB2 admission and WorldForge cache/release
        run: >-
          python -m unittest
          software_gpu.tests.test_glb_admission_security
          software_gpu.tests.test_glb_import_resource
          software_gpu.tests.test_aurion_offline_lod
          software_gpu.tests.test_worldforge_release
          -v
