name: ARE real Vulkan XCB Swapchain and Native Present evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/vulkan/weighted/**'
      - 'native/raster/**'
      - 'native/symbolic/core.hpp'
      - 'software_gpu/drivers/build_weighted_icd.py'
      - 'software_gpu/drivers/weighted_icd.py'
      - 'software_gpu/drivers/verify_weighted_wsi.py'
      - '.github/workflows/are-vulkan-xcb-wsi.yml'
  push:
    branches: [main]
    paths:
      - 'native/vulkan/weighted/**'
      - 'native/raster/**'
      - 'software_gpu/drivers/build_weighted_icd.py'
      - 'software_gpu/drivers/weighted_icd.py'
      - 'software_gpu/drivers/verify_weighted_wsi.py'
      - '.github/workflows/are-vulkan-xcb-wsi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-vulkan-xcb-wsi:
    name: Real VkQueueSubmit/Present and XCB independent GetImage
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install actual Vulkan Loader, SPIR-V and isolated XCB/Xvfb dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan-dev vulkan-tools glslang-tools spirv-tools libxcb1-dev xvfb xauth
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'vulkan==1.3.275.1'
      - name: Real Vulkan device to native CPU draw and window pixel readback
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m unittest software_gpu.tests.test_weighted_wsi_registry
          python -m software_gpu.drivers.verify_weighted_wsi evidence-local/real-vulkan-xcb --expected-revision "$EXPECTED_REVISION"
      - name: Real ARE Vulkan -> Mesa Zink profile admission (incompatible is not OpenGL success)
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m unittest software_gpu.tests.test_opengl_zink_preflight -v
          python -m software_gpu.drivers.verify_opengl_zink_preflight             evidence-local/real-vulkan-xcb/zink-capability             --manifest evidence-local/real-vulkan-xcb/icd/are.json             --expected-revision "$EXPECTED_REVISION"
          python - <<'PYZINK'
          import json
          from pathlib import Path
          data = json.loads(Path("evidence-local/real-vulkan-xcb/zink-capability/receipt.json").read_text())
          assert data["source_revision"] == __import__("os").environ["EXPECTED_REVISION"]
          assert data["real_glx_context_verified"] is False
          assert data["real_heaven_score_verified"] is False
          assert data["zink_vulkan_minimum_status"] == "incompatible"
          assert data["native_probe_exit"] == 3
          assert data["real_vulkan_device"]["missing_gl21_features"]
          assert data["real_vulkan_device"]["missing_gl21_extensions"]
          print("ARE_ZINK_MINIMUM_VULKAN_PROFILE_INCOMPATIBLE_NOT_GL_SUCCESS")
          PYZINK
      - name: Real Vulkan VkSampler create/destroy, immutable state, and negative admission
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m unittest software_gpu.tests.test_vulkan_sampler_contract -v
          g++ -std=c++17 -Wall -Wextra -Werror -I/usr/include native/vulkan/weighted/sampler_probe.cpp -lvulkan -o evidence-local/real-vulkan-xcb/sampler_probe
          export VK_DRIVER_FILES="$PWD/evidence-local/real-vulkan-xcb/icd/are.json"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          export OPENBLAS_NUM_THREADS=1
          export PYTHONPATH="$PWD:$(python -c 'import site; print(site.getsitepackages()[0])')"
          timeout 30 evidence-local/real-vulkan-xcb/sampler_probe | tee evidence-local/real-vulkan-xcb/sampler.stdout
          grep -q ARE_VK_SAMPLER_REAL_CREATE_DESTROY_PASS evidence-local/real-vulkan-xcb/sampler.stdout
          sha256sum native/vulkan/weighted/sampler_probe.cpp software_gpu/drivers/weighted_icd.py evidence-local/real-vulkan-xcb/icd/libare_weighted.so evidence-local/real-vulkan-xcb/sampler_probe evidence-local/real-vulkan-xcb/sampler.stdout > evidence-local/real-vulkan-xcb/sampler.sha256
      - name: Real Vulkan Index+Vertex buffers and XCB frame/depth parity (UINT16/UINT32)
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          python -m unittest software_gpu.tests.test_vulkan_indexed_buffer_contract -v
          g++ -std=c++17 -Wall -Wextra -Werror -I/usr/include native/vulkan/weighted/wsi_indexed_probe.cpp -lvulkan -lxcb -o evidence-local/real-vulkan-xcb/wsi_indexed_probe
          export VK_DRIVER_FILES="$PWD/evidence-local/real-vulkan-xcb/icd/are.json"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          export OPENBLAS_NUM_THREADS=1
          export PYTHONPATH="$PWD:$(python -c 'import site; print(site.getsitepackages()[0])')"
          xvfb-run -a -s '-screen 0 256x256x24' timeout 35 evidence-local/real-vulkan-xcb/wsi_indexed_probe evidence-local/real-vulkan-xcb/icd evidence-local/real-vulkan-xcb/indexed-A >evidence-local/real-vulkan-xcb/indexed-A.stdout
          xvfb-run -a -s '-screen 0 256x256x24' timeout 35 evidence-local/real-vulkan-xcb/wsi_indexed_probe evidence-local/real-vulkan-xcb/icd evidence-local/real-vulkan-xcb/indexed-B rgb-cycle >evidence-local/real-vulkan-xcb/indexed-B.stdout
          grep -q ARE_VK_REAL_INDEXED_DRAW_AND_NEGATIVE_PASS evidence-local/real-vulkan-xcb/indexed-A.stdout
          grep -q ARE_VK_REAL_INDEXED_DRAW_AND_NEGATIVE_PASS evidence-local/real-vulkan-xcb/indexed-B.stdout
          cmp evidence-local/real-vulkan-xcb/frame-A.rgba evidence-local/real-vulkan-xcb/indexed-A.rgba
          cmp evidence-local/real-vulkan-xcb/frame-A.depth evidence-local/real-vulkan-xcb/indexed-A.depth
          cmp evidence-local/real-vulkan-xcb/frame-B.rgba evidence-local/real-vulkan-xcb/indexed-B.rgba
          cmp evidence-local/real-vulkan-xcb/frame-B.depth evidence-local/real-vulkan-xcb/indexed-B.depth
          sha256sum native/vulkan/weighted/wsi_indexed_probe.cpp software_gpu/drivers/weighted_icd.py evidence-local/real-vulkan-xcb/icd/libare_weighted.so evidence-local/real-vulkan-xcb/wsi_indexed_probe evidence-local/real-vulkan-xcb/indexed-A.rgba evidence-local/real-vulkan-xcb/indexed-B.rgba evidence-local/real-vulkan-xcb/indexed-A.depth evidence-local/real-vulkan-xcb/indexed-B.depth > evidence-local/real-vulkan-xcb/indexed.sha256
      - name: Archive original window, depth, driver and source SHA receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: are-real-vulkan-xcb-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-local/real-vulkan-xcb/
          if-no-files-found: ignore
          retention-days: 30
