name: Issue 293 GLB LOD resource copy, stages and 15-pair replay
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/glb_container_preflight.py'
      - 'software_gpu/integrations/aurion/offline_lod_worker.py'
      - 'software_gpu/benchmarks/profile_glb_import_stages.py'
      - 'software_gpu/benchmarks/benchmark_glb_resources.py'
      - 'software_gpu/tests/test_glb_import_resource.py'
      - 'software_gpu/tests/fixtures/glb_resource_fixture.py'
      - '.github/workflows/issue293-glb-resource.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  glb-import-resource:
    name: GLB LOD buffer copy, 100-cycle release and real render
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU-only NumPy and Pillow
        run: python -m pip install --disable-pip-version-check 'numpy>=1.20,<3' 'Pillow>=9.0'
      - name: Real GLB2 parser, actual accessor and renderer/cycle regression
        run: >-
          python -m unittest
          software_gpu.tests.test_glb_import_resource
          software_gpu.tests.test_glb_container_preflight
          software_gpu.tests.test_glb_diagnostic_evidence
          -v
      - name: 15 interleaved paired isolated BIN slicing
        run: >-
          python -m software_gpu.benchmarks.benchmark_glb_resources
          --output evidence/issue293-ci/glb-preflight-measurements.json
          --bin-bytes 4194304
      - name: Observe isolated native one-mesh importer and two CPU draws
        run: >-
          python -m software_gpu.benchmarks.profile_glb_import_stages
          --output evidence/issue293-ci/native-single-mesh-stages.json
          --repeats 15
      - name: Audit complete timing, asset digests and exact-source provenance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          p = Path('evidence/issue293-ci/glb-preflight-measurements.json')
          doc = json.loads(p.read_text(encoding='utf-8'))
          assert doc['protocol'] == 'are.glb-resource-microbenchmark.v2'
          assert doc['source_revision'] == subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert doc['repeats'] == 15
          assert [r['mesh_count'] for r in doc['rows']] == [1, 100, 1300, 3500]
          assert doc['full_frame_benchmarked'] is False
          assert doc['native_multi_mesh_import_supported'] is False
          assert doc['export_benchmarked'] is False
          assert doc['bench_scope'] == 'bin_slice_expression_only'
          for path, digest in doc['source_paths_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest
          for row in doc['rows']:
              assert row['results']['semantic_results_identical']
              assert len(row['asset_sha256']) == 64
              for field in ('samples_ms', 'peak_traced_allocation_bytes'):
                  for mode in ('historical_copy', 'zero_copy_view'):
                      assert len(row['results'][field][mode]) == 15
              for s in row['results']['statistics_ms'].values():
                  assert s['n'] == 15 and all(k in s for k in ('median','p95','iqr','mad'))
          stage = json.loads(Path('evidence/issue293-ci/native-single-mesh-stages.json').read_text())
          assert stage['protocol'] == 'are.glb-import-stage-profile.v1'
          assert stage['source_revision'] == doc['source_revision']
          assert stage['repeats'] == 15 and stage['imported_meshes'] == 1
          assert stage['stages_independent_not_additive'] is True
          assert len(stage['rgba8_sha256']) == len(stage['depth_float32_sha256']) == 64
          assert stage['multi_mesh_native_import_supported'] is False
          for path, digest in stage['source_paths_sha256'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest
          for name, rec in stage['times_ms'].items():
              assert len(rec['raw']) == 15 and rec['stats']['n'] == 15, name
          print('ISSUE293_GLB_MEASUREMENTS_SHA_READBACK_OK')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: issue293-glb-measurement-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/issue293-ci/
          retention-days: 30
