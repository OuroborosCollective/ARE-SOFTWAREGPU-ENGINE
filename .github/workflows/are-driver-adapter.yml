name: ARE native driver adapter real CPU admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/raster/driver_adapter.*'
      - 'software_gpu/drivers/**'
      - 'software_gpu/tests/test_driver_adapter.py'
      - 'docs/VULKAN_DRIVER_ADAPTER_P0.md'
      - '.github/workflows/are-driver-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'native/raster/driver_adapter.*'
      - 'software_gpu/drivers/**'
      - 'software_gpu/tests/test_driver_adapter.py'
      - '.github/workflows/are-driver-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-cpu:
    name: Native real frame + fail-closed tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Exact PR-head source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install CPU NumPy, no Vulkan/GPU dependency
        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"
      - name: Real native driver adaptation RED/GREEN regressions
        run: python -m unittest software_gpu.tests.test_driver_adapter software_gpu.tests.test_native_raster -v
      - name: Build exact-source native CPU library, compare pixels and emit receipt
        shell: bash
        env:
          ARE_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m software_gpu.drivers.verify --expected-revision "$ARE_EXPECTED_REVISION" --output evidence-local/are-driver/receipt.json
      - name: Preserve actual CPU receipt, NOT Vulkan runtime proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: are-real-cpu-driver-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-local/are-driver/receipt.json
          if-no-files-found: ignore
          retention-days: 30
