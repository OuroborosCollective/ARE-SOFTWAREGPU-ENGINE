name: Vulkan Loader real Lavapipe reference (not ARE ICD)
on:
  pull_request:
    branches: [main]
    paths:
      - 'software_gpu/drivers/vulkan_reference.py'
      - 'software_gpu/tests/test_vulkan_loader_reference.py'
      - '.github/workflows/vulkan-lavapipe-reference.yml'
      - 'docs/VULKAN_DRIVER_ADAPTER_P0.md'
  push:
    branches: [main, 'feat/vulkan-*']
    paths:
      - 'software_gpu/drivers/vulkan_reference.py'
      - 'software_gpu/tests/test_vulkan_loader_reference.py'
      - '.github/workflows/vulkan-lavapipe-reference.yml'
      - 'docs/VULKAN_DRIVER_ADAPTER_P0.md'
      - 'Memory.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-vulkan-loader:
    name: Linux Lavapipe physical device reference-only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install distribution Vulkan loader tools and Mesa software driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vulkan-tools mesa-vulkan-drivers
      - name: Install required ARE import dependency\n        run: python -m pip install --disable-pip-version-check "numpy>=1.20,<3"\n      - name: Unit validation without runtime substitution
        run: python -m unittest software_gpu.tests.test_vulkan_loader_reference -v
      - name: Execute official Vulkan Loader on Mesa CPU ICD only
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          manifest=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' | sort | head -n 1)
          if [ -z "$manifest" ]; then
            echo 'No installed Lavapipe manifest' >&2
            exit 1
          fi
          python -m software_gpu.drivers.vulkan_reference --manifest "$manifest" --source-revision "$SOURCE_REVISION" --output evidence-local/vulkan-lavapipe/receipt.json
      - name: Preserve real loader and device identity output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulkan-lavapipe-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence-local/vulkan-lavapipe/receipt.json
          if-no-files-found: ignore
          retention-days: 30
