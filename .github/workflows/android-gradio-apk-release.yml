name: Android Gradio APK prerelease
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-gradio-apk-release.yml'
  workflow_run:
    workflows: ["CPU regressions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradio-android-apk-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  apk:
    permissions:
      contents: write
      packages: write
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exactly tested main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK Platform 35
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test portable Node client
        run: |
          set -euo pipefail
          cd clients/node
          npm test
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          short="${sha:0:12}"
          npm version "0.1.0-ci.${short}" --no-git-tag-version --allow-same-version
          npm pack --pack-destination "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist/linux dist/windows
          cp clients/node/bin/are-gradio.mjs dist/linux/are-gradio.mjs
          cp clients/node/bin/are-gradio.mjs dist/windows/are-gradio.mjs
          printf '%s\n' '#!/bin/sh' 'exec node "$(dirname "$0")/are-gradio.mjs" "$@"' > dist/linux/are-gradio
          chmod +x dist/linux/are-gradio
          printf '%s\r\n' '@echo off' 'node "%~dp0are-gradio.mjs" %*' > dist/windows/are-gradio.cmd
          bash -n dist/linux/are-gradio
          test "$(head -n1 dist/linux/are-gradio)" = '#!/bin/sh'
          python -c 'from pathlib import Path; p=Path("dist/windows/are-gradio.cmd").read_bytes(); assert p.startswith(b"@echo off\r\nnode ")'
          cp clients/node/LICENSE.md clients/node/NOTICE dist/linux/
          cp clients/node/LICENSE.md clients/node/NOTICE dist/windows/
          cp clients/node/README.md dist/linux/README.md
          cp clients/node/README.md dist/windows/README.md
          (cd dist && zip -qr "$GITHUB_WORKSPACE/ARE-Gradio-Linux.zip" linux)
          (cd dist && zip -qr "$GITHUB_WORKSPACE/ARE-Gradio-Windows.zip" windows)
          sha256sum ARE-Gradio-Linux.zip ARE-Gradio-Windows.zip *.tgz > desktop-node.sha256
      - name: Build real debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Verify APK archive and native Android package metadata
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='de.arelorian.softwaregpu'"
          sha256sum "$apk" | tee android-apk.sha256
          cp "$apk" ARE-SoftwareGPU-Gradio-Android-preview.apk
          sha256sum ARE-SoftwareGPU-Gradio-Android-preview.apk > ARE-SoftwareGPU-Gradio-Android-preview.apk.sha256
      - name: Verify Node packages and platform archives
        run: |
          set -euo pipefail
          tar -tzf ouroboroscollective-softwaregpu-gradio-client-*.tgz | grep -F 'package/bin/are-gradio.mjs'
          unzip -t ARE-Gradio-Linux.zip >/dev/null
          unzip -t ARE-Gradio-Windows.zip >/dev/null
          sha256sum -c desktop-node.sha256
      - name: Publish npm package to GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd clients/node
          printf '%s\n' '@ouroboroscollective:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          test "$(wc -l < .npmrc)" -eq 2
          grep -qxF '@ouroboroscollective:registry=https://npm.pkg.github.com' .npmrc
          configured_registry="$(npm config get @ouroboroscollective:registry)"
          test "${configured_registry%/}" = 'https://npm.pkg.github.com'
          trap 'rm -f .npmrc' EXIT
          npm publish --registry=https://npm.pkg.github.com --access public
          rm -f .npmrc
      - name: Verify GitHub registry publication
        if: github.event_name != 'pull_request'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd clients/node
          version=$(node -p "require('./package.json').version")
          published=$(npm view "@ouroboroscollective/softwaregpu-gradio-client@${version}" version --registry=https://npm.pkg.github.com)
          test "$published" = "$version"
      - name: Publish immutable SHA-tagged preview release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tag="gradio-android-${SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists for exact commit: $tag"
            exit 0
          fi
          gh release create "$tag" \
            ARE-SoftwareGPU-Gradio-Android-preview.apk \
            ARE-SoftwareGPU-Gradio-Android-preview.apk.sha256 \
            ARE-Gradio-Linux.zip ARE-Gradio-Windows.zip \
            ouroboroscollective-softwaregpu-gradio-client-*.tgz desktop-node.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Gradio Android preview ${SHA:0:12}" \
            --notes "CI-tested source SHA: $SHA. Android HTTPS Gradio companion plus Linux/Windows portable Node launchers and npm tarball. Linux/Windows require Node 20+. Ephemeral APK debug signing: preview only. GitHub Packages npm publish uses a SHA-specific package version; no embedded renderer or demo endpoint." \
            --prerelease
