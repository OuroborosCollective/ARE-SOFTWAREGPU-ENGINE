name: Android companion release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: ['Verified GoReleaser release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published desktop SemVer tag to retry, for example v1.2.50'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-companion-${{ github.event.workflow_run.head_sha || inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    name: Android release APK / emulator install and launch
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check negative release/version/signature cases
        run: |
          python -B -S -m unittest discover -s software_gpu/tests -p test_release_followup.py -v
          python -B -S -m unittest discover -s software_gpu/tests -p test_android_release.py -v
      - name: Derive prospective first-parent version for this exact PR test merge
        id: version
        run: python tools/release_version.py --sha "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android tools and isolated emulator image
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          manager = os.environ['ANDROID_HOME'] + '/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([manager, '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([manager, 'platforms;android-35', 'build-tools;35.0.0', 'platform-tools', 'emulator', 'system-images;android-35;google_apis;x86_64'], check=True)
          PY
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          bash tools/prepare_android_avd.sh
      - name: Compile real release variant with embedded source identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gradle -p android :app:assembleRelease --no-daemon "-PareReleaseVersion=$VERSION" "-PareSourceSha=$GITHUB_SHA"
      - name: Sign with an explicit throwaway CI test key (never published)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python tools/android_release.py sign --ci-test --tag "$TAG" --sha "$GITHUB_SHA" \
            --unsigned android/app/build/outputs/apk/release/app-release-unsigned.apk --output-dir release-assets/android
          python tools/android_release.py node --tag "$TAG" --sha "$GITHUB_SHA" --output-dir release-assets/android
      - name: Install, launch, inspect actual UI, read back APK and uninstall
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python tools/android_emulator_smoke.py --scope ci-test --tag "$TAG" --sha "$GITHUB_SHA" \
            --apk "release-assets/android/ARE-SoftwareGPU-$VERSION-android-companion.apk" \
            --output-dir "$RUNNER_TEMP/android-smoke"
      - name: Preserve actual CI APK and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ci-test-key-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-assets/android/
            ${{ runner.temp }}/android-smoke/
          if-no-files-found: error
          retention-days: 14

  context:
    name: Admit published desktop tag before Android signing
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      sha: ${{ steps.context.outputs.sha }}
    steps:
      - name: Load admission code from trusted main before any candidate checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require trusted publisher jobs, immutable tag, main source and published desktop bytes
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_followup.py resolve --event "$GITHUB_EVENT_PATH" \
            --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish persistent-key Android companion
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: android-apk-publish-${{ needs.context.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.context.outputs.tag }}
      VERSION: ${{ needs.context.outputs.version }}
      SOURCE_SHA: ${{ needs.context.outputs.sha }}
    steps:
      - name: Checkout only the SHA admitted by trusted-main desktop gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Report presence only; missing configuration blocks Android without changing desktop release
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          python - <<'PY'
          import json, os
          names = {'ANDROID_KEYSTORE_BASE64': 'HAS_KEYSTORE', 'ANDROID_KEYSTORE_PASSWORD': 'HAS_STORE_PASSWORD', 'ANDROID_KEY_ALIAS': 'HAS_ALIAS', 'ANDROID_KEY_PASSWORD': 'HAS_KEY_PASSWORD'}
          missing = [name for name, flag in names.items() if os.environ[flag] != 'true']
          print(json.dumps({'status': 'BLOCKED_MISSING_ANDROID_SIGNING_SECRETS' if missing else 'SIGNING_CONFIGURATION_PRESENT_UNVERIFIED', 'missing': missing}))
          if missing:
              raise SystemExit('Configure the permanent signing key via docs/ANDROID_RELEASE_SIGNING.md and retry this tag')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android tools and isolated emulator image
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess
          manager = os.environ['ANDROID_HOME'] + '/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([manager, '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([manager, 'platforms;android-35', 'build-tools;35.0.0', 'platform-tools', 'emulator', 'system-images;android-35;google_apis;x86_64'], check=True)
          PY
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          bash tools/prepare_android_avd.sh
      - name: Reuse immutable APK after a partially completed release attempt
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/android_release.py reuse --tag "$TAG" --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --output-dir release-assets/android --github-output "$GITHUB_OUTPUT"
      - name: Compile real release variant with shared version and exact source
        if: steps.reuse.outputs.reused != 'true'
        run: gradle -p android :app:assembleRelease --no-daemon "-PareReleaseVersion=$VERSION" "-PareSourceSha=$SOURCE_SHA"
      - name: Sign using the persistent owner key
        if: steps.reuse.outputs.reused != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python tools/android_release.py sign --tag "$TAG" --sha "$SOURCE_SHA" \
            --unsigned android/app/build/outputs/apk/release/app-release-unsigned.apk --output-dir release-assets/android
      - name: Install, launch, inspect UI, read back production-signed APK and uninstall
        run: |
          python tools/android_emulator_smoke.py --scope release --tag "$TAG" --sha "$SOURCE_SHA" \
            --apk "release-assets/android/ARE-SoftwareGPU-$VERSION-android-companion.apk" \
            --output-dir "$RUNNER_TEMP/android-smoke"
      - name: Recheck published desktop identity before companion publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_followup.py desktop-gate --tag "$TAG" --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/desktop-readback"
      - name: Publish same-version companion assets and read back all bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/android_release.py publish --tag "$TAG" --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --output-dir release-assets/android --smoke "$RUNNER_TEMP/android-smoke/android-emulator-smoke.json"
      - name: Preserve Android publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-${{ needs.context.outputs.sha }}-${{ github.run_attempt }}
          path: |
            release-assets/android/
            ${{ runner.temp }}/android-smoke/
          if-no-files-found: warn
          retention-days: 30

  node:
    name: Publish same-version Node clients independently of Android signing
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    concurrency:
      group: node-client-publish-${{ needs.context.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.context.outputs.tag }}
      SOURCE_SHA: ${{ needs.context.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck published desktop source/version before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_followup.py desktop-gate --tag "$TAG" --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --output-dir "$RUNNER_TEMP/desktop-readback"
      - name: Build, test, publish and read back actual npm tarball and portable archives
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          python tools/android_release.py publish-node --tag "$TAG" --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --output-dir release-assets/node
